name: iOS PR Fast Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-fast-verification:
    name: PR Fast Verification
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Start duration measurement
        id: lane-timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Validate CI workflow contract
        run: ruby Tests/CI/workflow_contract_test.rb
      - name: Prepare iOS test environment
        id: ios
        uses: ./.github/actions/prepare-ios
      - name: Run domain, scoring, and persistence tests
        run: |
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.ios.outputs.simulator-id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            -only-testing:DomainTests \
            -only-testing:ScoringEngineTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify deterministic launch and recovery smoke
        run: |
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.ios.outputs.simulator-id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:SoftballScoringUITests/ScrollReachabilityUITests/testUndoLatestPitchConfirmsCancelsAndRestoresLiveStateFromHistory \
            CODE_SIGNING_ALLOWED=NO
      - name: Record fast lane duration
        if: always()
        uses: ./.github/actions/report-ci-duration
        with:
          lane-name: PR Fast Verification
          started-at: ${{ steps.lane-timing.outputs.started_at }}
          status: ${{ job.status }}
