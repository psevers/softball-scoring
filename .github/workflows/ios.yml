name: iOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Select iOS Simulator
        id: simulator
        run: |
          simulator_id="$(
            xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json
          import sys

          devices = [
              device
              for runtime_devices in json.load(sys.stdin)["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = next(
              (device for device in devices if device["name"] == "iPhone 17"),
              devices[0] if devices else None,
          )
          if preferred:
              print(preferred["udid"])
          '
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found after installing the iOS platform." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.id }}'
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
      - name: Build for testing
        run: |
          NSUnbufferedIO=YES xcodebuild build-for-testing \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run domain and scoring tests
        run: |
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            -only-testing:DomainTests \
            -only-testing:ScoringEngineTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify UI test launch
        run: |
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:SoftballScoringUITests/ScrollReachabilityUITests/testStandardLiveGameStartsWithCompactAtBatAndPitchControls \
            CODE_SIGNING_ALLOWED=NO
      - name: Run remaining UI workflows
        run: |
          NSUnbufferedIO=YES xcodebuild test-without-building \
            -project SoftballScoring.xcodeproj \
            -scheme SoftballScoring \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/SoftballScoringDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:SoftballScoringUITests \
            -skip-testing:SoftballScoringUITests/ScrollReachabilityUITests/testStandardLiveGameStartsWithCompactAtBatAndPitchControls \
            CODE_SIGNING_ALLOWED=NO
